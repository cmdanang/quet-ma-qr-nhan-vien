<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tan Music - Modern Music Streaming</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      background: #170f23;
      color: white;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .song-card:hover {
      transform: translateY(-5px);
      transition: 0.3s;
    }

    .progress {
      width: 0%;
    }

    audio {
      display: none;
    }

    .admin-panel {
      display: none;
    }
  </style>
</head>
<body>

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 glass p-5 hidden md:block">
      <h1 class="text-3xl font-bold text-purple-400 mb-10">
        🎵 Tan Music
      </h1>

      <div class="space-y-3">
        <div class="sidebar-item p-3 rounded-xl cursor-pointer">
          <i class="fa-solid fa-house mr-2"></i> Trang chủ
        </div>

        <div class="sidebar-item p-3 rounded-xl cursor-pointer">
          <i class="fa-solid fa-chart-line mr-2"></i> Trending
        </div>

        <div class="sidebar-item p-3 rounded-xl cursor-pointer">
          <i class="fa-solid fa-music mr-2"></i> Playlist
        </div>

        <div class="sidebar-item p-3 rounded-xl cursor-pointer">
          <i class="fa-solid fa-heart mr-2"></i> Yêu thích
        </div>

        <div class="sidebar-item p-3 rounded-xl cursor-pointer" onclick="openAdmin()">
          <i class="fa-solid fa-lock mr-2"></i> Admin
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-5 pb-40">

      <!-- Search -->
      <div class="flex justify-between items-center mb-8">
        <div class="relative w-full md:w-96">
          <input
            type="text"
            placeholder="Tìm bài hát, ca sĩ..."
            class="w-full bg-[#2a1b3d] rounded-full px-5 py-3 outline-none"
          />
          <i class="fa-solid fa-search absolute right-5 top-4 text-gray-400"></i>
        </div>
      </div>

      <!-- Banner -->
      <div class="glass rounded-3xl p-10 mb-10 bg-gradient-to-r from-purple-700 to-pink-600">
        <h2 class="text-5xl font-bold mb-4">
          🎧 Music Streaming Platform
        </h2>

        <p class="text-lg opacity-90">
          Giao diện hiện đại kiểu ZingMP3 / Spotify
        </p>
      </div>

      <!-- Songs -->
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-2xl font-bold">
          🔥 Trending Songs
        </h2>
      </div>

      <div id="songList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
      </div>

    </main>
  </div>

  <!-- Player -->
  <div class="fixed bottom-0 left-0 right-0 glass p-4 border-t border-white/10">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">

      <div class="flex items-center gap-4">
        <img id="playerCover"
          src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=600"
          class="w-16 h-16 rounded-xl object-cover"
        />

        <div>
          <h3 id="playerTitle" class="font-bold">
            Chưa phát nhạc
          </h3>

          <p id="playerArtist" class="text-sm text-gray-300">
            ---
          </p>
        </div>
      </div>

      <div class="flex flex-col items-center flex-1 max-w-2xl">

        <div class="flex gap-5 text-xl mb-3">
          <button onclick="prevSong()">
            <i class="fa-solid fa-backward-step"></i>
          </button>

          <button onclick="togglePlay()" class="text-3xl">
            <i id="playIcon" class="fa-solid fa-circle-play"></i>
          </button>

          <button onclick="nextSong()">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <div class="w-full bg-gray-700 rounded-full h-2 cursor-pointer" onclick="seek(event)">
          <div id="progress" class="bg-purple-500 h-2 rounded-full progress"></div>
        </div>
      </div>

      <div>
        <input type="range" min="0" max="1" step="0.1" value="1" onchange="changeVolume(this.value)">
      </div>
    </div>
  </div>

  <!-- Hidden Audio -->
  <audio id="audio"></audio>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

    <div class="glass p-8 rounded-3xl w-96">
      <h2 class="text-3xl font-bold mb-6 text-center text-purple-400">
        🔐 Admin Login
      </h2>

      <input
        id="adminUser"
        type="text"
        placeholder="Username"
        class="w-full mb-4 bg-[#2a1b3d] p-3 rounded-xl outline-none"
      />

      <input
        id="adminPass"
        type="password"
        placeholder="Password"
        class="w-full mb-4 bg-[#2a1b3d] p-3 rounded-xl outline-none"
      />

      <button
        onclick="loginAdmin()"
        class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-xl font-bold"
      >
        Đăng nhập
      </button>

      <button
        onclick="closeAdmin()"
        class="w-full mt-3 bg-gray-700 p-3 rounded-xl"
      >
        Đóng
      </button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="admin-panel fixed inset-0 bg-[#120b1c] z-50 overflow-y-auto p-10">

    <div class="flex justify-between items-center mb-10">
      <h2 class="text-4xl font-bold text-purple-400">
        🎛️ Admin Dashboard
      </h2>

      <button onclick="closePanel()" class="bg-red-500 px-5 py-2 rounded-xl">
        Đóng
      </button>
    </div>

    <div class="glass p-6 rounded-3xl mb-10">

      <h3 class="text-2xl font-bold mb-5">
        ➕ Upload / Add Music
      </h3>

      <div class="grid md:grid-cols-2 gap-5">

        <input id="title" type="text" placeholder="Tên bài hát"
          class="bg-[#2a1b3d] p-3 rounded-xl outline-none">

        <input id="artist" type="text" placeholder="Ca sĩ"
          class="bg-[#2a1b3d] p-3 rounded-xl outline-none">

        <input id="cover" type="text" placeholder="Link ảnh cover"
          class="bg-[#2a1b3d] p-3 rounded-xl outline-none">

        <input id="audioUrl" type="text" placeholder="Link MP3"
          class="bg-[#2a1b3d] p-3 rounded-xl outline-none">

      </div>

      <button
        onclick="addSong()"
        class="mt-5 bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-xl font-bold"
      >
        Thêm bài hát
      </button>
    </div>

    <div>
      <h3 class="text-2xl font-bold mb-5">
        🎵 Quản lý nhạc
      </h3>

      <div id="adminSongs" class="space-y-4">
      </div>
    </div>

  </div>

  <script>

    let songs = [
      {
        title: 'Dreams',
        artist: 'Tanhenry',
        cover: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=600',
        audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
      },
      {
        title: 'Night Chill',
        artist: 'LoFi Studio',
        cover: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=600',
        audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
      },
      {
        title: 'Relax Mood',
        artist: 'Chill Music',
        cover: 'https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=600',
        audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'
      }
    ]

    const songList = document.getElementById('songList')
    const adminSongs = document.getElementById('adminSongs')
    const audio = document.getElementById('audio')

    let currentSong = 0
    let isPlaying = false

    function renderSongs() {

      songList.innerHTML = ''
      adminSongs.innerHTML = ''

      songs.forEach((song, index) => {

        songList.innerHTML += `
          <div class="song-card glass rounded-3xl overflow-hidden cursor-pointer">

            <img src="${song.cover}"
              class="w-full h-56 object-cover"
            />

            <div class="p-4">
              <h3 class="font-bold text-lg mb-1">
                ${song.title}
              </h3>

              <p class="text-gray-300 text-sm mb-4">
                ${song.artist}
              </p>

              <button
                onclick="playSong(${index})"
                class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-xl w-full"
              >
                ▶ Phát nhạc
              </button>
            </div>
          </div>
        `

        adminSongs.innerHTML += `
          <div class="glass p-5 rounded-2xl flex justify-between items-center flex-wrap gap-4">

            <div class="flex items-center gap-4">
              <img src="${song.cover}" class="w-16 h-16 rounded-xl object-cover">

              <div>
                <h4 class="font-bold">${song.title}</h4>
                <p class="text-gray-400 text-sm">${song.artist}</p>
              </div>
            </div>

            <button
              onclick="deleteSong(${index})"
              class="bg-red-500 hover:bg-red-600 px-5 py-2 rounded-xl"
            >
              Xóa
            </button>
          </div>
        `
      })
    }

    renderSongs()

    function playSong(index) {

      currentSong = index

      const song = songs[index]

      audio.src = song.audio
      audio.play()

      isPlaying = true

      document.getElementById('playerTitle').innerText = song.title
      document.getElementById('playerArtist').innerText = song.artist
      document.getElementById('playerCover').src = song.cover

      document.getElementById('playIcon').className = 'fa-solid fa-circle-pause'
    }

    function togglePlay() {

      if (!audio.src) return

      if (isPlaying) {
        audio.pause()
        isPlaying = false
        document.getElementById('playIcon').className = 'fa-solid fa-circle-play'
      }
      else {
        audio.play()
        isPlaying = true
        document.getElementById('playIcon').className = 'fa-solid fa-circle-pause'
      }
    }

    function nextSong() {
      currentSong++

      if (currentSong >= songs.length) {
        currentSong = 0
      }

      playSong(currentSong)
    }

    function prevSong() {
      currentSong--

      if (currentSong < 0) {
        currentSong = songs.length - 1
      }

      playSong(currentSong)
    }

    audio.addEventListener('timeupdate', () => {

      const progress = document.getElementById('progress')

      if (audio.duration) {
        progress.style.width = (audio.currentTime / audio.duration) * 100 + '%'
      }
    })

    function seek(e) {

      const width = e.currentTarget.clientWidth
      const clickX = e.offsetX
      const duration = audio.duration

      audio.currentTime = (clickX / width) * duration
    }

    function changeVolume(value) {
      audio.volume = value
    }

    function openAdmin() {
      document.getElementById('adminModal').style.display = 'flex'
    }

    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none'
    }

    function loginAdmin() {

      const user = document.getElementById('adminUser').value
      const pass = document.getElementById('adminPass').value

      if (user === 'admin' && pass === '110193') {

        closeAdmin()

        document.getElementById('adminPanel').style.display = 'block'

        alert('Đăng nhập admin thành công!')
      }
      else {
        alert('Sai tài khoản hoặc mật khẩu')
      }
    }

    function closePanel() {
      document.getElementById('adminPanel').style.display = 'none'
    }

    function addSong() {

      const title = document.getElementById('title').value
      const artist = document.getElementById('artist').value
      const cover = document.getElementById('cover').value
      const audioUrl = document.getElementById('audioUrl').value

      if (!title || !artist || !cover || !audioUrl) {
        alert('Vui lòng nhập đầy đủ thông tin')
        return
      }

      songs.push({
        title,
        artist,
        cover,
        audio: audioUrl
      })

      renderSongs()

      document.getElementById('title').value = ''
      document.getElementById('artist').value = ''
      document.getElementById('cover').value = ''
      document.getElementById('audioUrl').value = ''

      alert('Đã thêm bài hát')
    }

    function deleteSong(index) {

      if (confirm('Xóa bài hát này?')) {
        songs.splice(index, 1)
        renderSongs()
      }
    }

    audio.addEventListener('ended', () => {
      nextSong()
    })

  </script>

</body>
</html>
