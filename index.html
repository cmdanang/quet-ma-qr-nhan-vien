<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MusicBox · Nghe nhạc nhúng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sub {
            text-align: center;
            color: #a0b3d9;
            margin-bottom: 32px;
            font-size: 0.9rem;
        }
        /* Player khung lớn */
        .player-card {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .embed-container iframe {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            border: none;
            transition: 0.2s;
        }
        .now-playing {
            margin-top: 16px;
            text-align: center;
            color: #ffdf8c;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }
        /* Danh sách bài hát dạng lưới */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 10px;
        }
        .song-item {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .song-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-4px);
        }
        .song-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            margin-bottom: 6px;
        }
        .song-artist {
            font-size: 0.85rem;
            color: #bfc9e6;
            margin-bottom: 10px;
        }
        .platform-badge {
            font-size: 0.7rem;
            background: #2a3a5e;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            color: #bdd4ff;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #6c7a9e;
            font-size: 0.75rem;
        }
        @media (max-width: 600px) {
            .embed-container iframe { height: 160px; }
            .song-grid { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎧 MusicBox · Nhúng trực tuyến</h1>
    <div class="sub">Chọn bài hát bên dưới – phát từ YouTube, SoundCloud hoặc Spotify</div>

    <!-- Vùng hiển thị player nhúng -->
    <div class="player-card">
        <div class="embed-container" id="embedContainer">
            <iframe src="https://www.youtube.com/embed/1AF_oUUqxXo?si=WgOyrMMVnIH7Ruam&amp" 
                    title="music player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
        <div class="now-playing" id="nowPlaying">🎵 Chưa chọn bài → hãy click vào một bài hát</div>
    </div>

    <!-- Danh sách bài hát (đổ bằng JavaScript) -->
    <div class="song-grid" id="songList"></div>
    <footer>✨ Nhúng hợp pháp | Âm thanh phát từ nền tảng gốc</footer>
</div>

<script>
    // 🔁 THAY ĐỔI DANH SÁCH NÀY BẰNG BÀI HÁT CỦA BẠN
    const playlist = [
        {
            title: "Shape of You",
            artist: "Ed Sheeran",
            platform: "YouTube",
            embedUrl: "https://www.youtube.com/embed/1AF_oUUqxXo?si=WgOyrMMVnIH7Ruam&amp"
        },
        {
            title: "Blinding Lights",
            artist: "The Weeknd",
            platform: "YouTube",
            embedUrl: "https://www.youtube.com/embed/1AF_oUUqxXo?si=WgOyrMMVnIH7Ruam&amp"
        },
        {
            title: "Chill Lofi Study",
            artist: "Lofi Girl",
            platform: "YouTube",
            embedUrl: "https://www.youtube.com/embed/1AF_oUUqxXo?si=WgOyrMMVnIH7Ruam&amp"
        },
        {
            title: "Flowers (remix)",
            artist: "Miley Cyrus",
            platform: "SoundCloud",
            embedUrl: "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1439428235&color=%23ff5500&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false"
        },
        {
            title: "Chill Vibes Playlist",
            artist: "Spotify",
            platform: "Spotify",
            embedUrl: "https://open.spotify.com/embed/playlist/37i9dQZF1DX8Uebhn9wzrS?utm_source=generator"
        }
    ];

    // Hàm hiển thị danh sách
    function buildSongList() {
        const container = document.getElementById('songList');
        if (!container) return;
        container.innerHTML = '';
        playlist.forEach((song, idx) => {
            const card = document.createElement('div');
            card.className = 'song-item';
            card.setAttribute('data-index', idx);
            card.innerHTML = `
                <div class="song-title">${escapeHtml(song.title)}</div>
                <div class="song-artist">${escapeHtml(song.artist)}</div>
                <div class="platform-badge">📀 ${escapeHtml(song.platform)}</div>
            `;
            card.addEventListener('click', () => playSongByIdx(idx));
            container.appendChild(card);
        });
    }

    // Phát bài hát theo index
    function playSongByIdx(index) {
        const song = playlist[index];
        if (!song) return;
        const embedContainer = document.getElementById('embedContainer');
        const nowPlayingDiv = document.getElementById('nowPlaying');
        
        // Tạo iframe mới với URL nhúng
        embedContainer.innerHTML = `
            <iframe src="${song.embedUrl}" 
                    title="music player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        `;
        nowPlayingDiv.innerHTML = `🎶 Đang phát: ${escapeHtml(song.title)} — ${escapeHtml(song.artist)} (${song.platform})`;
    }

    // Bảo vệ an toàn ký tự
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Khởi tạo trang: hiển thị danh sách, mặc định phát bài đầu tiên (nếu có)
    buildSongList();
    if (playlist.length > 0) {
        playSongByIdx(0);
    }
</script>
</body>
</html>
