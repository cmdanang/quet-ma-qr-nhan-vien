<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFlow - Quản lý nhạc</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>MusicFlow</span>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Khám phá</span>
                </a>
                <a href="/admin" class="nav-item active">
                    <i class="fas fa-user-cog"></i>
                    <span>Quản lý</span>
                </a>
            </nav>
            <div class="playlist-info">
                <i class="fas fa-database"></i>
                <p>Quản lý thư viện<br><span>Upload, xóa, tải nhạc</span></p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content admin-content">
            <header class="header">
                <h1><i class="fas fa-crown"></i> Trang quản lý</h1>
                <div class="admin-badge">
                    <i class="fas fa-shield-alt"></i> Administrator
                </div>
            </header>

            <!-- Upload Form -->
            <div class="upload-card">
                <h2><i class="fas fa-cloud-upload-alt"></i> Tải lên bài hát mới</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> Tên bài hát</label>
                        <input type="text" id="title" placeholder="Nhập tên bài hát..." required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nghệ sĩ</label>
                        <input type="text" id="artist" placeholder="Nhập tên nghệ sĩ..." required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-file-audio"></i> File MP3</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="songFile" accept=".mp3" required>
                            <span class="file-name">Chưa có file nào được chọn</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-upload">
                        <i class="fas fa-upload"></i> Upload nhạc
                    </button>
                </form>
                <div id="uploadMessage" class="upload-message"></div>
            </div>

            <!-- Songs List -->
            <div class="songs-list-card">
                <h2><i class="fas fa-headphones"></i> Danh sách bài hát</h2>
                <div class="songs-table-container">
                    <table class="songs-table" id="songsTable">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Tên bài hát</th>
                                <th>Nghệ sĩ</th>
                                <th>Ngày tải lên</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="songsTableBody">
                            <tr><td colspan="5" class="loading">Đang tải danh sách...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
